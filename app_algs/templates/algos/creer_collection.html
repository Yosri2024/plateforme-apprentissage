<!-- Page de création de collection de problèmes d'algorithmes -->
{% extends "base.html" %}

{% block title %}Créer une collection - Algorithmes{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="mb-6">
        <h1 class="text-3xl font-bold text-gray-900">Créer une nouvelle collection</h1>
        <p class="text-gray-600">Organisez les problèmes algorithmiques qui vous intéressent</p>
    </div>
    
    <div class="bg-white rounded-lg shadow-md p-8">
        <form method="post" class="space-y-6">
            {% csrf_token %}
            
            <div>
                <label for="titre" class="block text-sm font-medium text-gray-700 mb-2">Titre de la collection *</label>
                <input type="text" name="titre" id="titre" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="Ex: Problèmes de tri">
            </div>
            
            <div>
                <label for="description" class="block text-sm font-medium text-gray-700 mb-2">Description</label>
                <textarea name="description" id="description" rows="4"
                          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                          placeholder="Décrivez votre collection (optionnel)"></textarea>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-3">Sélectionner les problèmes</label>
                <div class="border border-gray-300 rounded-md p-4 max-h-96 overflow-y-auto">
                    {% for probleme in problemes %}
                        <div class="flex items-center py-2">
                            <input type="checkbox" name="problemes" id="probleme_{{ probleme.id }}" value="{{ probleme.id }}"
                                   class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                            <label for="probleme_{{ probleme.id }}" class="ml-3 block text-sm text-gray-700 cursor-pointer">
                                <span class="font-medium">{{ probleme.titre }}</span>
                                <span class="text-gray-500 ml-2">({{ probleme.get_difficulte_display }})</span>
                            </label>
                        </div>
                    {% endfor %}
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Visibilité</label>
                <div class="mt-2 space-y-2">
                    <label class="inline-flex items-center">
                        <input type="checkbox" name="est_publique" id="est_publique" value="true"
                               class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                        <span class="ml-2 text-sm text-gray-700">Rendre cette collection publique (visible pour tous)</span>
                    </label>
                </div>
            </div>
            
            <div class="flex items-center justify-between pt-6 border-t border-gray-200">
                <button type="submit" class="bg-blue-600 text-white px-8 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                    Créer la collection
                </button>
                <a href="{% url 'app_algs:accueil' %}" class="text-gray-600 hover:text-gray-800">Annuler</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
