<!-- Page de modification de cours -->
{% extends "base.html" %}

{% block title %}Modifier le cours - {{ cours.titre }}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-lg shadow-md p-8">
        <h1 class="text-2xl font-bold text-gray-900 mb-6">Modifier le cours: {{ cours.titre }}</h1>
        
        <form method="post" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}
            
            <div>
                <label for="titre" class="block text-sm font-medium text-gray-700 mb-2">Titre du cours *</label>
                <input type="text" name="titre" id="titre" value="{{ cours.titre }}" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div>
                <label for="description" class="block text-sm font-medium text-gray-700 mb-2">Description *</label>
                <textarea name="description" id="description" rows="4" required
                          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">{{ cours.description }}</textarea>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="niveau" class="block text-sm font-medium text-gray-700 mb-2">Niveau</label>
                    <select name="niveau" id="niveau"
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="debutant" {% if cours.niveau == 'debutant' %}selected{% endif %}>Débutant</option>
                        <option value="intermediaire" {% if cours.niveau == 'intermediaire' %}selected{% endif %}>Intermédiaire</option>
                        <option value="avance" {% if cours.niveau == 'avance' %}selected{% endif %}>Avancé</option>
                    </select>
                </div>
                
                <div>
                    <label for="est_publie" class="block text-sm font-medium text-gray-700 mb-2">Statut</label>
                    <div class="mt-2">
                        <label class="inline-flex items-center">
                            <input type="checkbox" name="est_publie" id="est_publie" value="true" {% if cours.est_publie %}checked{% endif %}
                                   class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                            <span class="ml-2 text-sm text-gray-700">Publier (visible pour tous)</span>
                        </label>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center justify-between">
                <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                    Mettre à jour le cours
                </button>
                <a href="{% url 'app_web:detail_cours' slug=cours.slug %}" class="text-gray-600 hover:text-gray-800">Annuler</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
